<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fraud Investigation Report</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 40px;
            width: 100%;
            max-width: 640px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            background: #e8f4fd;
            color: #1a73e8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .risk-banner {
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            margin-bottom: 28px;
        }

        .risk-banner.red    { background: #fff0f0; border: 2px solid #e53935; }
        .risk-banner.orange { background: #fff8f0; border: 2px solid #fb8c00; }
        .risk-banner.green  { background: #f0fff4; border: 2px solid #43a047; }
        .risk-banner.gray   { background: #f5f5f5; border: 2px solid #999; }

        .risk-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: #555;
        }

        .risk-score {
            font-size: 42px;
            font-weight: 800;
        }

        .red    .risk-score { color: #e53935; }
        .orange .risk-score { color: #fb8c00; }
        .green  .risk-score { color: #43a047; }
        .gray   .risk-score { color: #999; }

        .action-pill {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .red    .action-pill { background: #e53935; color: white; }
        .orange .action-pill { background: #fb8c00; color: white; }
        .green  .action-pill { background: #43a047; color: white; }
        .gray   .action-pill { background: #999; color: white; }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
        }

        .section-body {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 14px 16px;
        }

        .signals-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .signal-item {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 10px 14px;
        }

        .signal-label {
            font-size: 11px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .signal-value {
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 24px 0;
        }

        .meta {
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 24px;
            padding: 12px;
            background: #f0f2f5;
            color: #444;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #e0e2e5;
        }

        @media (max-width: 480px) {
            .signals-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="card">

    <div class="header">
        <span class="badge">Powered by Claude AI</span>
        <h1>Fraud Investigation Report</h1>
    </div>

    <!-- Risk Score Banner -->
    <div class="risk-banner" th:classappend="${report.riskColor}">
        <div class="risk-label">Risk Score</div>
        <div class="risk-score" th:text="${report.riskScore}">HIGH</div>
        <span class="action-pill" th:text="${report.recommendedAction}">Decline</span>
    </div>

    <!-- Signals Submitted -->
    <div class="section-title">Transaction Signals Analyzed</div>
    <div class="signals-grid">
        <div class="signal-item">
            <div class="signal-label">Amount</div>
            <div class="signal-value" th:text="${transaction.transactionAmount}"></div>
        </div>
        <div class="signal-item">
            <div class="signal-label">Velocity</div>
            <div class="signal-value" th:text="${transaction.transactionVelocity}"></div>
        </div>
        <div class="signal-item">
            <div class="signal-label">Geographic Match</div>
            <div class="signal-value" th:text="${transaction.geographicMatch}"></div>
        </div>
        <div class="signal-item">
            <div class="signal-label">Card Type</div>
            <div class="signal-value" th:text="${transaction.cardType}"></div>
        </div>
        <div class="signal-item">
            <div class="signal-label">Time of Day</div>
            <div class="signal-value" th:text="${transaction.timeOfDay}"></div>
        </div>
        <div class="signal-item">
            <div class="signal-label">Channel</div>
            <div class="signal-value" th:text="${transaction.channel}"></div>
        </div>
    </div>

    <div class="divider"></div>

    <!-- Signals Detected -->
    <div class="section">
        <div class="section-title">Signals Detected</div>
        <div class="section-body" th:text="${report.signalsDetected}"></div>
    </div>

    <!-- Reasoning -->
    <div class="section">
        <div class="section-title">Agent Reasoning</div>
        <div class="section-body" th:text="${report.reasoning}"></div>
    </div>

    <div class="divider"></div>

    <!-- Meta -->
    <div class="meta">
        Model: <span th:text="${report.modelUsed}"></span> |
        Input tokens: <span th:text="${report.inputTokens}"></span> |
        Output tokens: <span th:text="${report.outputTokens}"></span>
    </div>

    <a href="/" class="back-btn">Run Another Investigation</a>

</div>
</body>
</html>
