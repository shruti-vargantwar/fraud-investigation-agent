# Server
server.port=8080

# Claude API Configuration
# Never hardcode the key here - always use environment variable
anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-sonnet-4-6
anthropic.api.max-tokens=1024

# App name
spring.application.name=fraud-investigation-agent

# Logging
logging.level.com.shruti=DEBUG